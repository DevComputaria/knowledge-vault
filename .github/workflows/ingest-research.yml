name: Ingest research

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to ingest
        required: true
        type: number

permissions: {}

concurrency:
  group: knowledge-ingest-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.action == 'opened' ||
      github.event.label.name == 'knowledge/ready' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request == null &&
       startsWith(github.event.comment.body, '/knowledge') &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Mark new issue as ready for ingestion
        if: github.event_name == 'issues' && github.event.action == 'opened'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GH_REPO" --add-label "knowledge/ready"

      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Download issue for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" > issue.json

      - name: Select event payload
        id: payload
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "path=issue.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=$GITHUB_EVENT_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Process newly opened research
        if: github.event_name == 'issues' && github.event.action == 'opened'
        run: python scripts/process_issue.py --event "${{ steps.payload.outputs.path }}" --root . --allow-unready

      - name: Process labeled or manually dispatched research
        if: github.event_name != 'issue_comment' && (github.event_name != 'issues' || github.event.action != 'opened')
        run: python scripts/process_issue.py --event "${{ steps.payload.outputs.path }}" --root .

      - name: Process opted-in comment
        if: github.event_name == 'issue_comment'
        run: python scripts/process_issue.py --event "${{ steps.payload.outputs.path }}" --root . --comment

      - name: Create issue review pull request
        if: github.event_name != 'issue_comment'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/knowledge-issue-${{ github.event.issue.number || inputs.issue_number }}
          delete-branch: true
          commit-message: "knowledge: ingest issue #${{ github.event.issue.number || inputs.issue_number }}"
          title: "knowledge: ingest issue #${{ github.event.issue.number || inputs.issue_number }}"
          body: |
            Ingestão automatizada da pesquisa.

            - Confira o texto original e sua proveniência.
            - Valide domínio, tags e referências.
            - Referências são capturadas como não verificadas.
          labels: knowledge/review

      - name: Create comment review pull request
        if: github.event_name == 'issue_comment'
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ github.token }}
          branch: automation/knowledge-comment-${{ github.event.comment.id }}
          delete-branch: true
          commit-message: "knowledge: ingest comment #${{ github.event.comment.id }}"
          title: "knowledge: ingest comment from issue #${{ github.event.issue.number }}"
          body: |
            Ingestão de comentário iniciado por `/knowledge`.

            - Confira o vínculo com a pesquisa pai.
            - Valide o domínio e as tags herdadas.
            - O comentário permanece marcado como não verificado.
          labels: knowledge/review
